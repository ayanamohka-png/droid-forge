<svg width="256" height="256" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38BDF8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#22D3EE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Android robot silhouette -->
  <g transform="translate(128, 140)">
    <!-- Head -->
    <rect x="-30" y="-80" width="60" height="50" rx="8" fill="#F8FAFC" opacity="0.9"/>
    <!-- Eyes -->
    <circle cx="-15" cy="-65" r="4" fill="#0F172A"/>
    <circle cx="15" cy="-65" r="4" fill="#0F172A"/>
    <!-- Body -->
    <rect x="-35" y="-25" width="70" height="60" rx="8" fill="#F8FAFC" opacity="0.9"/>
    <!-- Arms -->
    <rect x="-50" y="-20" width="10" height="40" rx="5" fill="#F8FAFC" opacity="0.9"/>
    <rect x="40" y="-20" width="10" height="40" rx="5" fill="#F8FAFC" opacity="0.9"/>
    <!-- Legs -->
    <rect x="-25" y="40" width="15" height="35" rx="7" fill="#F8FAFC" opacity="0.9"/>
    <rect x="10" y="40" width="15" height="35" rx="7" fill="#F8FAFC" opacity="0.9"/>
  </g>

  <!-- Lightning bolt overlay -->
  <path d="M 145 60 L 120 110 L 140 110 L 120 160 L 165 100 L 145 100 Z"
        fill="url(#bolt)"
        stroke="#F8FAFC"
        stroke-width="2"
        opacity="0.95"/>

  <!-- Wrench tool -->
  <g transform="translate(90, 80) rotate(-25)">
    <rect x="0" y="0" width="8" height="35" rx="4" fill="#F97316" opacity="0.9"/>
    <circle cx="4" cy="0" r="6" fill="#F97316" opacity="0.9" stroke="#F8FAFC" stroke-width="1.5"/>
  </g>
</svg>
