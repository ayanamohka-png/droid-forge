[package]
name = "droidforge"
version = "2.0.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.15"

[build-dependencies]
slint-build = "1.16"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
